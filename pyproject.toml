[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caligo"
version = "0.2.0"
description = "Human workspaces, persistent containerized agents, and reproducible experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
caligo = "caligo.cli:main"

[tool.setuptools]
packages = ["caligo", "caligo.web"]
include-package-data = false

[tool.setuptools.package-dir]
"caligo.web" = "ui"

[tool.setuptools.package-data]
caligo = ["Agent.Dockerfile"]
"caligo.web" = ["out/**/*", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Docker daemon"]
