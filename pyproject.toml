[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caligo"
version = "0.1.0"
description = "Isolated coding attempts, remote dev commands, and reproducible experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
caligo = "caligo.cli:main"

[tool.setuptools]
packages = ["caligo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Docker daemon"]
